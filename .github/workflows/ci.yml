name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            jq \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest \
            qt6-declarative-dev-tools \
            rsync \
            shellcheck
      - name: Validate shell and manifest
        run: |
          bash -n bin/omarewind test/all test/backend-test.sh test/package-test.sh
          shellcheck --severity=style bin/omarewind test/all test/backend-test.sh test/package-test.sh
          jq -e '.schemaVersion == 1 and .id == "com.omarchy.omarewind"' manifest.json >/dev/null
      - name: Run isolated backend suite
        run: test/backend-test.sh
      - name: Test presentation model
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input test/qml -silent
      - name: Verify packaged archive
        run: |
          git archive --format=tar HEAD | tar -tf - >/dev/null
          test "$(git ls-tree HEAD bin/omarewind | awk '{print $1}')" = "100755"
