<svg xmlns="http://www.w3.org/2000/svg" width="500" height="572" viewBox="0 0 500 572" role="img" aria-labelledby="title desc">
  <title id="title">OmaLab active experiment panel</title>
  <desc id="desc">A Tokyo Night themed OmaLab panel showing one safe configuration change and its bounded diff.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
  </defs>
  <rect x=".75" y=".75" width="498.5" height="570.5" fill="#16161e" stroke="#7aa2f7" stroke-width="1.5"/>

  <g font-family="JetBrainsMono Nerd Font, ui-monospace, monospace">
    <rect x="16" y="16" width="468" height="79" rx="7" fill="url(#header)" stroke="#3b4261"/>
    <circle cx="40" cy="40" r="20" fill="#3b4261"/>
    <path d="M43 28v8l7 12c2 3 0 6-4 6H35c-4 0-6-3-4-6l7-12v-8" fill="none" stroke="#c0caf5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 47h13" stroke="#bb9af7" stroke-width="2.6" stroke-linecap="round"/>
    <text x="76" y="35" fill="#c0caf5" font-size="12" font-weight="700">Trying a new rice</text>
    <text x="76" y="53" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1.1">FEARLESS MODE · JUST STARTED · TOKYO NIGHT</text>
    <rect x="416" y="25" width="54" height="24" rx="3" fill="#24283b" stroke="#565f89"/>
    <text x="443" y="40" text-anchor="middle" fill="#c0caf5" font-size="8">1 CHANGE</text>

    <rect x="16" y="110" width="229" height="34" fill="#1f2335" stroke="#565f89"/>
    <text x="130.5" y="131" text-anchor="middle" fill="#9ece6a" font-size="9" font-weight="700">✓  KEEP CHANGES</text>
    <rect x="255" y="110" width="229" height="34" fill="#283457" stroke="#7aa2f7"/>
    <text x="369.5" y="131" text-anchor="middle" fill="#7aa2f7" font-size="9" font-weight="700">↶  REWIND CONFIGS</text>

    <text x="16" y="164" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1">SINCE YOUR CHECKPOINT</text>
    <g transform="translate(16 174)">
      <g>
        <rect width="150" height="80" fill="#1f2335" stroke="#565f89"/>
        <text x="75" y="35" text-anchor="middle" fill="#c0caf5" font-size="24" font-weight="700">1</text>
        <text x="75" y="53" text-anchor="middle" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1.4">FILES</text>
        <text x="75" y="68" text-anchor="middle" fill="#565f89" font-size="8">+1</text>
      </g>
      <g transform="translate(159)">
        <rect width="150" height="80" fill="#1f2335" stroke="#565f89"/>
        <text x="75" y="35" text-anchor="middle" fill="#c0caf5" font-size="24" font-weight="700">0</text>
        <text x="75" y="53" text-anchor="middle" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1.4">PACKAGES</text>
        <text x="75" y="68" text-anchor="middle" fill="#565f89" font-size="8">NO CHANGES</text>
      </g>
      <g transform="translate(318)">
        <rect width="150" height="80" fill="#1f2335" stroke="#565f89"/>
        <text x="75" y="35" text-anchor="middle" fill="#c0caf5" font-size="24" font-weight="700">0</text>
        <text x="75" y="53" text-anchor="middle" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1.4">PLUGINS</text>
        <text x="75" y="68" text-anchor="middle" fill="#565f89" font-size="8">NO CHANGES</text>
      </g>
    </g>

    <text x="16" y="278" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1">RECENT CONFIGURATION CHANGES</text>
    <text x="16" y="294" fill="#a9b1d6" font-size="8">Click a file to preview its diff. Rewind Configs restores every</text>
    <text x="16" y="306" fill="#a9b1d6" font-size="8">listed file.</text>

    <rect x="16" y="314" width="468" height="28" fill="#24283b" stroke="#565f89"/>
    <text x="22" y="332" fill="#565f89" font-size="8" font-weight="700">ADDED</text>
    <text x="99" y="332" fill="#7aa2f7" font-size="9">omarchy/omalab-demo.txt</text>
    <text x="473" y="332" text-anchor="end" fill="#7aa2f7" font-size="11">⌄</text>

    <rect x="16" y="347" width="468" height="104" fill="#1f2130" stroke="#565f89"/>
    <text x="24" y="365" fill="#c0caf5" font-size="8">.config/omarchy/omalab-demo.txt</text>
    <text x="24" y="382" fill="#a9b1d6" font-size="8">--- /dev/null</text>
    <text x="24" y="397" fill="#a9b1d6" font-size="8">+++ current/.config/omarchy/omalab-demo.txt</text>
    <text x="24" y="412" fill="#7aa2f7" font-size="8">@@ -0,0 +1,2 @@</text>
    <text x="24" y="427" fill="#9ece6a" font-size="8">+OmaLab 1.0 release preview.</text>
    <text x="24" y="442" fill="#9ece6a" font-size="8">+One safe config change, ready to rewind.</text>

    <path d="M16 468H484" stroke="#3b4261"/>
    <text x="16" y="490" fill="#7aa2f7" font-size="8" font-weight="700" letter-spacing="1">SYSTEM CHECKPOINT</text>
    <text x="16" y="507" fill="#a9b1d6" font-size="8">Optional root snapshot for package and kernel</text>
    <text x="16" y="520" fill="#a9b1d6" font-size="8">experiments. Opens the official Omarchy command.</text>
    <rect x="397" y="488" width="87" height="33" fill="#1f2335" stroke="#565f89"/>
    <text x="440.5" y="509" text-anchor="middle" fill="#c0caf5" font-size="9">↶  CREATE</text>

    <text x="250" y="552" text-anchor="middle" fill="#565f89" font-size="8">K keep  ·  R rewind  ·  D preview  ·  Esc close</text>
  </g>
</svg>
