<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OmaRewind — Fearless Mode for Omarchy</title>
  <desc id="desc">A dark blue product card showing an OmaRewind checkpoint and the Keep Changes and Rewind Configs actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="0.58" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".05"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7aa2f7" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="190" cy="120" r="210" fill="url(#glow)"/>

  <g transform="translate(82 76)">
    <g transform="translate(0 1)">
      <circle cx="47" cy="47" r="46" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
      <path d="M52 19v19l16 27c4 7-1 14-9 14H34c-8 0-13-7-9-14l16-27V19" fill="none" stroke="#c0caf5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 60h27" stroke="#bb9af7" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 29a28 28 0 0 1 38-8" fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round"/>
      <path d="m64 13 7 9-11 2" fill="#9ece6a"/>
    </g>

    <text x="0" y="152" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="4">OMARCHY PLUGIN</text>
    <text x="0" y="205" fill="#c0caf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750">OmaRewind</text>
    <text x="1" y="245" fill="#bb9af7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2">FEARLESS MODE</text>
    <text x="1" y="285" fill="#a9b1d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Checkpoint. Experiment. Keep—or rewind.</text>
  </g>

  <g transform="translate(620 48)" filter="url(#shadow)">
    <rect width="496" height="324" rx="14" fill="#16161e" stroke="#565f89"/>
    <rect x="1" y="1" width="494" height="74" rx="13" fill="#1f2335"/>
    <circle cx="42" cy="38" r="21" fill="#3b4261"/>
    <path d="M45 22v10l8 14c2 4 0 7-5 7H36c-4 0-7-3-5-7l8-14V22" fill="none" stroke="#c0caf5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="31" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">Trying a new rice</text>
    <text x="78" y="52" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.2">FEARLESS MODE · 8 MINUTES</text>
    <rect x="400" y="23" width="70" height="28" rx="4" fill="#24283b" stroke="#565f89"/>
    <text x="435" y="41" fill="#c0caf5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">7 CHANGES</text>

    <g transform="translate(24 94)">
      <rect width="216" height="42" rx="5" fill="#1f2335" stroke="#565f89"/>
      <text x="108" y="27" fill="#9ece6a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">✓  KEEP CHANGES</text>
      <rect x="232" width="216" height="42" rx="5" fill="#283457" stroke="#7aa2f7"/>
      <text x="340" y="27" fill="#7aa2f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">↶  REWIND CONFIGS</text>
    </g>

    <text x="24" y="167" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.1">SINCE YOUR CHECKPOINT</text>
    <g transform="translate(24 181)">
      <g>
        <rect width="141" height="82" rx="6" fill="#1f2335" stroke="#3b4261"/>
        <text x="70.5" y="35" fill="#c0caf5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">7</text>
        <text x="70.5" y="55" fill="#7aa2f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.4">FILES</text>
        <text x="70.5" y="70" fill="#565f89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">+3  ~4</text>
      </g>
      <g transform="translate(153)">
        <rect width="141" height="82" rx="6" fill="#1f2335" stroke="#3b4261"/>
        <text x="70.5" y="35" fill="#c0caf5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">0</text>
        <text x="70.5" y="55" fill="#7aa2f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.4">PACKAGES</text>
        <text x="70.5" y="70" fill="#565f89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">NO CHANGES</text>
      </g>
      <g transform="translate(306)">
        <rect width="141" height="82" rx="6" fill="#1f2335" stroke="#3b4261"/>
        <text x="70.5" y="35" fill="#c0caf5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">0</text>
        <text x="70.5" y="55" fill="#7aa2f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.4">PLUGINS</text>
        <text x="70.5" y="70" fill="#565f89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">NO CHANGES</text>
      </g>
    </g>
    <text x="24" y="292" fill="#565f89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">ADDED</text>
    <text x="88" y="292" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">hypr/experimental-layout.lua</text>
  </g>
</svg>
